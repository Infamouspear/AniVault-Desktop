name: Windows Release Candidate
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Run regression tests on Windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q --disable-warnings -x
      - name: Build clean application and installer
        shell: pwsh
        env:
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: ./packaging/build_windows.ps1 -AniListClientId $env:ANILIST_CLIENT_ID
      - uses: actions/upload-artifact@v4
        with:
          name: AniVault-Windows-RC
          path: |
            dist/installer/*.exe
            dist/AniVault/**
          if-no-files-found: error
